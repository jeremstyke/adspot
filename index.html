function set(l){const d=T[l]||T.en;document.documentElement.lang=l;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=d[e.dataset.t]);document.querySelectorAll('#langs a').forEach(a=>a.classList.toggle('on',a.dataset.l===l));try{localStorage.setItem('l',l)}catch(e){}}
