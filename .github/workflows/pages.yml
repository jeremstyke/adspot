name: Build and deploy the website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the pages (40 languages)
        run: node build.js
      - name: Render the images
        run: |
          mkdir -p _site/img
          for f in og insideads tghub; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=6000 \
              --screenshot="$PWD/_site/img/$f.png" "file://$PWD/img-src/$f.html"
          done
          ls -la _site/img
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
