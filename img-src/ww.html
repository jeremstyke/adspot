<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,700;0,800;0,900;1,900&display=block" rel="stylesheet"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:"Inter","Segoe UI",Arial,sans-serif;color:#fff;position:relative;background:#06142b}
.sky{position:absolute;inset:0;background:radial-gradient(260px 170px at 6% 30%,rgba(190,225,255,.55),transparent 70%),radial-gradient(260px 170px at 94% 30%,rgba(190,225,255,.55),transparent 70%),radial-gradient(900px 420px at 50% 20%,#123a7a,transparent 75%),linear-gradient(180deg,#071634 0%,#0b2350 48%,#0d3a2a 62%,#0f5a2a 100%)}
.lights{position:absolute;top:120px;width:150px;height:60px;background:radial-gradient(circle,#fff 0 4px,transparent 5px) 0 0/22px 22px;opacity:.85;filter:blur(.5px)}
.pitch{position:absolute;left:0;right:0;bottom:0;height:250px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 90px,transparent 90px 180px),linear-gradient(180deg,#167a35,#0d5a25)}
.circ{position:absolute;left:50%;bottom:-150px;width:520px;height:260px;margin-left:-260px;border:4px solid rgba(255,255,255,.55);border-radius:50%}
.vline{position:absolute;left:50%;bottom:0;width:4px;height:250px;background:rgba(255,255,255,.5)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,12,30,.92) 0%,rgba(4,12,30,.7) 45%,rgba(4,12,30,.05) 75%)}
.w{position:absolute;left:72px;top:70px;width:700px}
.tag{display:inline-block;padding:10px 22px;border-radius:999px;background:rgba(46,229,122,.16);border:2px solid #2ee57a;font-weight:800;font-size:24px;letter-spacing:2px;color:#b9ffd6}
.ww{font-style:italic;font-weight:900;line-height:.95;letter-spacing:-2px;margin:26px 0 0;font-size:100px}
.ww .a{color:#fff;-webkit-text-stroke:3px #0b1530;text-shadow:0 6px 0 #0b1530}
.ww .b{color:#ffd21f;-webkit-text-stroke:3px #0b1530;text-shadow:0 6px 0 #0b1530}
h1{font-size:96px;line-height:1;margin:28px 0 0;letter-spacing:-3px;font-weight:900;font-style:italic;-webkit-text-stroke:2px #0b1530;text-shadow:0 6px 0 #0b1530}
.sub{margin-top:20px;font-size:32px;font-weight:700;color:#d8e6ff}
.pills{position:absolute;left:72px;bottom:58px;display:flex;gap:16px}
.p{padding:14px 28px;border-radius:16px;font-size:28px;font-weight:900;background:#fff;color:#0b1530;box-shadow:0 6px 0 #0b1530}
.p.d{background:#ffd21f}
.badge{position:absolute;right:58px;top:70px;width:470px;height:470px}
.f{position:absolute;right:66px;bottom:30px;font-size:22px;font-weight:800;color:rgba(255,255,255,.75)}
</style></head><body>
<div class="sky"></div><div class="lights" style="left:20px"></div><div class="lights" style="right:20px"></div>
<div class="pitch"><div class="circ"></div><div class="vline"></div></div>
<div class="shade"></div>
<svg class="badge" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <radialGradient id="st" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#1d4fa0"/><stop offset=".6" stop-color="#0b2350"/><stop offset="1" stop-color="#071634"/></radialGradient>
  <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f9a45"/><stop offset="1" stop-color="#0d5a25"/></linearGradient>
  <radialGradient id="ball" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#eef2f6"/><stop offset="1" stop-color="#c9d3dd"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe45c"/><stop offset="1" stop-color="#ffb800"/></linearGradient>
  <clipPath id="cc"><circle cx="100" cy="100" r="88"/></clipPath><clipPath id="bc"><circle cx="100" cy="108" r="44"/></clipPath>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".5"/></filter>
 </defs>
 <circle cx="100" cy="100" r="96" fill="#0a1a2e"/>
 <g clip-path="url(#cc)"><rect width="200" height="200" fill="url(#st)"/><rect y="130" width="200" height="70" fill="url(#gr)"/>
  <ellipse cx="100" cy="196" rx="70" ry="22" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2"/>
  <circle cx="22" cy="78" r="16" fill="rgba(200,230,255,.45)"/><circle cx="178" cy="78" r="16" fill="rgba(200,230,255,.45)"/></g>
 <circle cx="100" cy="100" r="90" fill="none" stroke="#2ee57a" stroke-width="7"/>
 <g filter="url(#sh)">
  <circle cx="100" cy="108" r="44" fill="url(#ball)" stroke="#0b1530" stroke-width="4"/>
  <g clip-path="url(#bc)" fill="#1d2433"><polygon points="100,92 116,103 110,122 90,122 84,103"/><polygon points="100,62 112,70 108,82 92,82 88,70"/><polygon points="142,98 148,112 140,126 130,118 132,102"/><polygon points="58,98 68,102 70,118 60,126 52,112"/></g>
  <path d="M68 62 L74 30 L88 48 L100 24 L112 48 L126 30 L132 62 Z" fill="url(#gold)" stroke="#0b1530" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="40" y="128" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="58" fill="#3ee36b" stroke="#0b1530" stroke-width="4" paint-order="stroke" transform="rotate(-12 40 110)">?</text>
  <text x="150" y="128" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="58" fill="#ffd21f" stroke="#0b1530" stroke-width="4" paint-order="stroke" transform="rotate(12 160 110)">?</text>
  <text x="100" y="178" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-style="italic" font-weight="900" font-size="30" fill="#fff" stroke="#0b1530" stroke-width="5" paint-order="stroke">Who <tspan fill="#ffd21f">Wins?</tspan></text>
 </g>
</svg>
<div class="w" id="w"></div>
<div class="pills" id="pills"></div>
<div class="f">t.me/whowinsfootball</div>
<script>
var L={CL:'Champions League',PL:'Premier League',PD:'La Liga',SA:'Serie A',BL1:'Bundesliga',FL1:'Ligue 1',DED:'Eredivisie',PPL:'Primeira Liga'};
var c=(location.search.match(/c=(\w+)/)||[])[1];
var w=document.getElementById('w');
if(c&&L[c]){w.innerHTML='<div class="tag">WHO WINS? · MATCH PREDICTION</div><h1>'+L[c]+'</h1><div class="sub">Right pick: 3 pts · Wrong pick: 1 pt</div>';
document.getElementById('pills').innerHTML='<div class="p">HOME</div><div class="p d">DRAW</div><div class="p">AWAY</div>';}
else{w.innerHTML='<div class="tag">FREE FOOTBALL GAME · NO BETTING</div><div class="ww"><span class="a">Who</span> <span class="b">Wins?</span></div><div class="sub">Pick the winners of the big matches and climb the daily, weekly and monthly leaderboards.</div>';}
</script>
</body></html>
