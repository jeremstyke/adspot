<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,700;0,800;1,900&display=block" rel="stylesheet"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:"Inter",Arial,sans-serif;color:#fff;background:radial-gradient(700px 500px at 80% 45%,#2a6cf0,transparent 70%),linear-gradient(135deg,#071226,#0b2a6e 60%,#103a9a);position:relative}
.w{position:absolute;left:72px;top:110px;width:600px}
.tag{display:inline-block;padding:10px 22px;border-radius:999px;background:rgba(95,240,255,.14);border:2px solid #5ff0ff;font-weight:800;font-size:24px;letter-spacing:2px;color:#c9f8ff}
h1{font-size:92px;line-height:1;margin:26px 0 0;font-style:italic;font-weight:900;letter-spacing:-2px}
h1 b{color:#ffd21f}
p{font-size:32px;line-height:1.35;font-weight:700;color:#d6e4ff;margin:22px 0 0}
.logo{position:absolute;right:50px;top:55px;width:520px;height:520px}
.logo svg{width:520px;height:520px}
.f{position:absolute;left:72px;bottom:44px;font-size:24px;font-weight:800;color:rgba(255,255,255,.7)}
</style></head><body>
<div class="w"><div class="tag">UNOFFICIAL · DAILY</div><h1>Telegram <b>HUB</b></h1><p>News, hidden tips, polls and the best new bots &amp; channels. Every day.</p></div>
<div class="logo"><svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#2a6cf0"/><stop offset=".55" stop-color="#103a9a"/><stop offset="1" stop-color="#071a4a"/></radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ff0ff"/><stop offset="1" stop-color="#2d7bff"/></linearGradient>
  <radialGradient id="globe" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#9ff4ff"/><stop offset=".45" stop-color="#2fb6ff"/><stop offset="1" stop-color="#0b4fd0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff07a"/><stop offset=".5" stop-color="#ffd21f"/><stop offset="1" stop-color="#ff9f00"/></linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6e4ff"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020a24" flood-opacity=".6"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="gc"><circle cx="320" cy="250" r="118"/></clipPath>
 </defs>
 <circle cx="320" cy="320" r="320" fill="#071226"/>
 <circle cx="320" cy="320" r="300" fill="url(#bg)"/>
 <circle cx="320" cy="320" r="300" fill="none" stroke="url(#ring)" stroke-width="14"/>
 <!-- light rays -->
 <clipPath id="inner"><circle cx="320" cy="320" r="292"/></clipPath><g opacity=".18" fill="#ffffff" clip-path="url(#inner)">
  <path d="M320 250 L250 30 L300 30Z"/><path d="M320 250 L340 30 L390 30Z"/><path d="M320 250 L80 120 L100 90Z"/><path d="M320 250 L560 120 L540 90Z"/>
 </g>
 <!-- sparkles -->
 <g fill="#fff">
  <path d="M120 200 l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" opacity=".9"/>
  <path d="M520 190 l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity=".8"/>
  <path d="M500 330 l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity=".7"/>
 </g>
 <!-- globe -->
 <circle cx="320" cy="250" r="140" fill="#5ff0ff" opacity=".35" filter="url(#glow)"/>
 <g filter="url(#sh)">
  <circle cx="320" cy="250" r="118" fill="url(#globe)" stroke="#0b1840" stroke-width="7"/>
  <g clip-path="url(#gc)" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="5">
   <ellipse cx="320" cy="250" rx="52" ry="118"/>
   <line x1="320" y1="132" x2="320" y2="368"/>
   <line x1="202" y1="250" x2="438" y2="250"/>
   <path d="M210 195 Q320 225 430 195"/><path d="M210 305 Q320 275 430 305"/>
  </g>
  <ellipse cx="282" cy="196" rx="38" ry="20" fill="#fff" opacity=".45" transform="rotate(-28 282 196)"/>
  <!-- orbit with chat bubble -->
  <ellipse cx="320" cy="250" rx="175" ry="52" fill="none" stroke="url(#gold)" stroke-width="9" transform="rotate(-18 320 250)"/>
  <g transform="translate(452 160)">
   <path d="M-34 -26h68a14 14 0 0 1 14 14v30a14 14 0 0 1-14 14h-36l-22 18v-18h-10a14 14 0 0 1-14-14v-30a14 14 0 0 1 14-14z" fill="url(#gold)" stroke="#0b1840" stroke-width="6" stroke-linejoin="round"/>
   <circle cx="-16" cy="2" r="6" fill="#0b1840"/><circle cx="2" cy="2" r="6" fill="#0b1840"/><circle cx="20" cy="2" r="6" fill="#0b1840"/>
  </g>
 </g>
 <!-- wordmark -->
 <g filter="url(#sh)" font-family="Inter,Arial Black,Arial,sans-serif" font-style="italic" font-weight="900" text-anchor="middle">
  <text x="320" y="462" font-size="78" fill="url(#white)" stroke="#0b1840" stroke-width="12" paint-order="stroke" letter-spacing="-2">Telegram</text>
  <text x="320" y="560" font-size="112" fill="url(#gold)" stroke="#0b1840" stroke-width="14" paint-order="stroke" letter-spacing="2">HUB</text>
 </g>
</svg></div>
<div class="f">t.me/tghubdaily</div>
</body></html>
